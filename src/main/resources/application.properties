# DB: set SPRING_DATASOURCE_URL (jdbc:postgresql://host/db?sslmode=require), SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# ponytail: ddl-auto=update instead of migrations; switch to Flyway when the schema needs real evolution.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
